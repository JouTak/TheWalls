lobby:
  world: "lobby"
  # x, y, z, yaw, pitch
  spawn: "0, 65, 0, 0, 0"

# Игроков в одной команде. Всего команд в режиме TheWalls сейчас всегда 4.
players-per-team: 4

match:
  # Сценарий фаз (подготовка/открытие/и т.д.) настраивается в отдельном файле:
  # plugins/TheWalls/scenario-config.yml
  # Поля total-seconds/build-seconds здесь используются как fallback и для первичного генератора сценария.
  countdown-seconds: 10
  # Backward-compatible: duration-seconds is treated as total-seconds.
  duration-seconds: 900
  # Total match time.
  total-seconds: 900
  # Time until walls are opened (phase BUILD -> OPEN).
  build-seconds: 600
  walls:
    # How many wall blocks to process per server tick when opening walls.
    # Higher values -> faster opening, but more load per tick.
    blocks-per-tick: 8000
    # Материалы, которые НЕ нужно удалять из регионов стен при их открытии.
    # Пример: если регион стен захватывает и декоративные элементы.
    keep-blocks: []

  rules:
    # Разрешить урон игрокам во время BUILD.
    # По умолчанию выключено: пока стены закрыты, PvP обычно не нужно.
    pvp-in-build: false
    # Разрешить урон по своим (friendly-fire).
    friendly-fire: false
    # Блоки, которые нельзя ломать/ставить в матче.
    # (обычно это технические блоки карты)
    protected-blocks:
      - "BEDROCK"
      - "BARRIER"
      - "STRUCTURE_BLOCK"
      - "STRUCTURE_VOID"
      - "JIGSAW"
      - "COMMAND_BLOCK"
      - "CHAIN_COMMAND_BLOCK"
      - "REPEATING_COMMAND_BLOCK"

guardians:
  enabled: true
  # Сколько раз нужно убить хранителя, чтобы он был окончательно уничтожен.
  lives: 3
  # Через сколько секунд хранитель возрождается после смерти, пока у него есть жизни.
  respawn-seconds: 10
  # Базовое здоровье хранителя (vanilla у иллюзионера 32.0).
  max-health: 40.0
  # Имя хранителя. Можно использовать &-цвета.
  name: "Хранитель"

# Список арен. template-world — мир-шаблон (будет клонироваться в новый мир на матч).
# team-spawns — точки спавна команд внутри арены.
arenas:
  - id: "tw_map_1"
    template-world: "tw_map_1"
    pool-size: 1
    # (Опционально) Центр — пока используется только как информация для будущих фич.
    center:
      point: "0, 70, 0"
      radius: 0
    team-spawns:
      ORANGE: "5, 70, 90, 180, 0"
      BLUE: "-90, 70, 5, 90, 0"
      PINK: "-5, 70, -90, 0, 0"
      GREEN: "90, 70, -5, -90, 0"
    # (Опционально) спавны хранителей (иллюзионеров). Если не указано — используются team-spawns.
    # guardian-spawns:
    #   ORANGE: "5, 70, 85, 180, 0"
    #   BLUE: "-85, 70, 5, 90, 0"
    #   PINK: "-5, 70, -85, 0, 0"
    #   GREEN: "85, 70, -5, -90, 0"
    # Wall regions:
    # - во время BUILD игроки не могут пересекать эти регионы (даже если там воздух или блоки можно сломать)
    # - при переходе BUILD -> OPEN блоки внутри регионов удаляются (AIR), кроме keep-blocks.
    # Format: "x1, y1, z1, x2, y2, z2" (block coords). You can add multiple regions.
    walls:
      # - "-15, 64, -2, 15, 90, 2"

# Ceremony world after match end (per-match clone).
# Players will be placed on podiums (places 1-4) and won't be able to leave their 4x4 area.
ceremony:
  enabled: false
  template-world: "tw_ceremony"
  duration-seconds: 12
  # List of podium definitions, in order of places 1..4.
  # Format (string): "minX,y,minZ,maxX,maxZ,yaw,pitch" (yaw/pitch optional)
  # Example: ["0,65,0,3,3,180", "10,65,0,13,3,180", "20,65,0,23,3,180", "30,65,0,33,3,180"]
  podiums: []
